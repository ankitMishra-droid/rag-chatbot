
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chakra — Adaptive Responsive Intelligent Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c14;
    --surface: #0d1421;
    --surface2: #111827;
    --border: rgba(255,255,255,0.07);
    --accent: #00d4ff;
    --accent2: #7c3aed;
    --accent-glow: rgba(0,212,255,0.15);
    --text: #f0f4f8;
    --muted: #6b7a90;
    --error: #ff4757;
    --success: #00e676;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
  }

  .bg-grid {
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    animation: gridMove 20s linear infinite;
  }
  @keyframes gridMove { to { transform: translateY(50px); } }

  .bg-blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.12;
    animation: blobPulse 8s ease-in-out infinite alternate;
  }
  .blob1 { width: 500px; height: 500px; background: var(--accent); top: -150px; right: -150px; }
  .blob2 { width: 400px; height: 400px; background: var(--accent2); bottom: -100px; left: -100px; animation-delay: -4s; }
  @keyframes blobPulse { from { transform: scale(1) rotate(0deg); } to { transform: scale(1.2) rotate(20deg); } }

  .container {
    position: relative; z-index: 1;
    width: 100%;
    max-width: 440px;
    padding: 24px;
    animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .logo {
    text-align: center;
    margin-bottom: 40px;
  }
  .logo-icon {
    width: 64px; height: 64px;
    margin: 0 auto 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    box-shadow: 0 0 40px rgba(0,212,255,0.3), 0 0 80px rgba(124,58,237,0.2);
    position: relative;
  }
  .logo-icon::after {
    content: '';
    position: absolute; inset: -1px;
    border-radius: 21px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    z-index: -1;
    opacity: 0.5;
    filter: blur(8px);
  }
  .logo h1 {
    font-family: 'Syne', sans-serif;
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .logo p {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 36px;
    backdrop-filter: blur(20px);
    box-shadow: 0 0 0 1px rgba(0,212,255,0.05), 0 40px 80px rgba(0,0,0,0.5);
  }

  .tabs {
    display: flex;
    background: var(--surface2);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 28px;
    gap: 4px;
  }
  .tab-btn {
    flex: 1; padding: 10px;
    background: none; border: none;
    color: var(--muted);
    font-family: 'Syne', sans-serif;
    font-size: 14px; font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .tab-btn.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .form-group input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    outline: none;
    transition: all 0.2s;
    -webkit-appearance: none;
    appearance: none;
  }
  .form-group input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .form-group input::placeholder { color: var(--muted); }

  .btn-primary {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; border-radius: 12px;
    color: #fff;
    font-family: 'Syne', sans-serif;
    font-size: 15px; font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: all 0.2s;
    position: relative; overflow: hidden;
    margin-top: 4px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 30px rgba(0,212,255,0.25); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .btn-primary .spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .alert {
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
  .alert.error { background: rgba(255,71,87,0.1); border: 1px solid rgba(255,71,87,0.2); color: #ff6b7a; }
  .alert.success { background: rgba(0,230,118,0.1); border: 1px solid rgba(0,230,118,0.2); color: #00e676; }
  .alert.show { display: block; animation: fadeIn 0.3s ease; }

  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 20px 0;
    color: var(--muted); font-size: 12px;
  }
  .divider::before, .divider::after {
    content: ''; flex: 1;
    height: 1px; background: var(--border);
  }

  .guest-btn {
    width: 100%;
    padding: 13px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .guest-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }

  .footer-text {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 24px;
  }

  /* ── Responsive ── */

  /* Large tablets and small laptops */
  @media (max-width: 480px) {
    .container {
      padding: 16px;
    }
    .card {
      padding: 24px 20px;
      border-radius: 20px;
    }
    .logo {
      margin-bottom: 28px;
    }
    .logo-icon {
      width: 56px; height: 56px;
      font-size: 24px;
      border-radius: 16px;
    }
    .logo h1 {
      font-size: 26px;
    }
    .logo p {
      font-size: 10px;
      letter-spacing: 1.5px;
    }
    .tab-btn {
      font-size: 13px;
      padding: 9px 6px;
    }
    .form-group input {
      font-size: 16px; /* prevents iOS zoom on focus */
      padding: 13px 14px;
    }
    .btn-primary {
      font-size: 15px;
      padding: 14px;
    }
    .guest-btn {
      padding: 12px;
    }
  }

  /* Small phones (iPhone SE, Galaxy A) */
  @media (max-width: 360px) {
    .container {
      padding: 12px;
    }
    .card {
      padding: 20px 16px;
      border-radius: 16px;
    }
    .logo {
      margin-bottom: 22px;
    }
    .logo-icon {
      width: 48px; height: 48px;
      font-size: 20px;
      margin-bottom: 12px;
    }
    .logo h1 {
      font-size: 22px;
    }
    .tabs {
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .footer-text {
      margin-top: 16px;
      font-size: 11px;
    }
  }

  /* Very short screens / landscape phones */
  @media (max-height: 600px) and (orientation: landscape) {
    body {
      align-items: flex-start;
      padding: 12px 0;
      overflow-y: auto;
    }
    .logo {
      margin-bottom: 16px;
    }
    .logo-icon {
      width: 40px; height: 40px;
      font-size: 18px;
      margin-bottom: 8px;
    }
    .logo h1 { font-size: 20px; }
    .logo p { display: none; }
    .card { padding: 20px; }
    .form-group { margin-bottom: 10px; }
    .form-group input { padding: 10px 14px; }
    .btn-primary { padding: 12px; }
    .divider { margin: 12px 0; }
  }

  /* Tablets (portrait) */
  @media (min-width: 481px) and (max-width: 768px) {
    .container {
      max-width: 420px;
      padding: 20px;
    }
  }

  /* Wide screens — center comfortably */
  @media (min-width: 1024px) {
    .container {
      max-width: 460px;
    }
  }

  /* Blob scaling for small screens */
  @media (max-width: 480px) {
    .blob1 { width: 300px; height: 300px; }
    .blob2 { width: 250px; height: 250px; }
  }
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-blob blob1"></div>
<div class="bg-blob blob2"></div>

<div class="container">
  <div class="logo">
    <div class="logo-icon">🤖</div>
    <h1>chakraa</h1>
    <p>Adaptive Responsive Intelligent Assistant</p>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Sign In</button>
      <button class="tab-btn" onclick="switchTab('register')">Create Account</button>
    </div>

    <!-- LOGIN -->
    <div class="tab-content active" id="tab-login">
      <div id="login-alert" class="alert error"></div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="login-username" placeholder="your_username" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn-primary" id="login-btn" onclick="handleLogin()">Sign In to chakra</button>
      <div class="divider">or</div>
      <button class="guest-btn" onclick="handleGuestLogin()">Continue as Guest</button>
    </div>

    <!-- REGISTER -->
    <div class="tab-content" id="tab-register">
      <div id="register-alert" class="alert"></div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="reg-username" placeholder="choose_username" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Email (optional)</label>
        <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="Min. 6 characters" autocomplete="new-password">
      </div>
      <button class="btn-primary" id="register-btn" onclick="handleRegister()">Create Account</button>
    </div>
  </div>

  <p class="footer-text">Powered by RAG + Llama3 · Your data stays private</p>
</div>

<script>
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === (tab === 'login' ? 0 : 1)));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
}

function showAlert(id, msg, type = 'error') {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = `alert ${type} show`;
}
function hideAlert(id) { document.getElementById(id).className = 'alert error'; }

function setLoading(btnId, loading, text) {
  const btn = document.getElementById(btnId);
  btn.disabled = loading;
  btn.innerHTML = loading ? `<span class="spinner"></span>Connecting...` : text;
}

async function handleLogin() {
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  hideAlert('login-alert');
  if (!username || !password) return showAlert('login-alert', 'Please enter username and password');
  setLoading('login-btn', true, 'Sign In to chakra');
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (res.ok) {
      localStorage.setItem('chakra_token', data.token);
      localStorage.setItem('chakra_user', JSON.stringify(data.user));
      localStorage.setItem('chakra_session', data.session_id);
      window.location.href = '/dashboard';
    } else {
      showAlert('login-alert', data.error || 'Login failed');
      setLoading('login-btn', false, 'Sign In to chakra');
    }
  } catch(e) {
    showAlert('login-alert', 'Connection error. Is the server running?');
    setLoading('login-btn', false, 'Sign In to chakra');
  }
}

async function handleGuestLogin() {
  const res = await fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: 'guest', password: 'guest123' })
  });
  if (res.ok) {
    const data = await res.json();
    localStorage.setItem('chakra_token', data.token);
    localStorage.setItem('chakra_user', JSON.stringify(data.user));
    localStorage.setItem('chakra_session', data.session_id);
    window.location.href = '/dashboard';
  } else {
    showAlert('login-alert', 'Guest access not available');
  }
}

async function handleRegister() {
  const username = document.getElementById('reg-username').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  hideAlert('register-alert');
  if (!username || !password) return showAlert('register-alert', 'Username and password required');
  if (password.length < 6) return showAlert('register-alert', 'Password must be at least 6 characters');
  setLoading('register-btn', true, 'Create Account');
  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, email })
    });
    const data = await res.json();
    if (res.ok) {
      showAlert('register-alert', '✓ Account created! Signing you in...', 'success');
      setTimeout(() => {
        document.getElementById('login-username').value = username;
        document.getElementById('login-password').value = password;
        switchTab('login');
        handleLogin();
      }, 1000);
    } else {
      showAlert('register-alert', data.error || 'Registration failed');
      setLoading('register-btn', false, 'Create Account');
    }
  } catch(e) {
    showAlert('register-alert', 'Connection error.');
    setLoading('register-btn', false, 'Create Account');
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const activeTab = document.querySelector('.tab-content.active').id;
    if (activeTab === 'tab-login') handleLogin();
    else handleRegister();
  }
});

const token = localStorage.getItem('chakra_token');
if (token) {
  fetch('/api/auth/verify', { headers: { Authorization: `Bearer ${token}` } })
    .then(r => r.ok && (window.location.href = '/dashboard'))
    .catch(() => {});
}
</script>
</body>
</html>
